<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8" />
 <title>NOTAM Map Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/ol@v10.9.0/dist/ol.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.9.0/ol.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div id="sidebar">
  <div id="firList">
    <h3>FIR 一覧</h3>
    <div class="fir-item" data-fir="UHPP">UHPP（Petropavlovsk）</div>
    <div class="fir-item" data-fir="UHMM">UHMM（Magadan）</div>
    <div class="fir-item" data-fir="UHSS">UHSS（Yuzhno-Sakhalinsk）</div>
    <div class="fir-item" data-fir="UHHH">UHHH（Khabarovsk）</div>
    <div class="fir-item" data-fir="ZBPE">ZBPE（Beijing）</div>
    <div class="fir-item" data-fir="ZSHA">ZSHA（Shanghai）</div>
  </div>
  <div class="divider" id="divider1"></div>
  <div id="notamList"><p>FIR を選択してください。</p></div>
  <div class="divider" id="divider2"></div>
  <div id="detail"><p>NOTAM 詳細がここに表示されます。</p></div>
</div>
<div id="popup" class="ol-popup">
  <a href="#" id="popup-closer" class="ol-popup-closer"></a>
  <div id="popup-content"></div>
<script src="main.js"></script>
<script src="popup.js"></script>
</div>
</body>
</html>
